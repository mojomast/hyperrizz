<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hyperrizz review guest</title>
  <style>
    html,body,iframe{margin:0;border:0;width:100%;height:100%;overflow:hidden;background:#101216}
    iframe{display:block}
  </style>
</head>
<body>
  <iframe title="Live film" sandbox="allow-scripts"></iframe>
  <script>
    // Chromium caps navigable data URLs. This small opaque guest receives the
    // bounded film document after boot; film code never enters Hermes's host DOM.
    const film = document.querySelector('iframe');
    addEventListener('message', e => {
      if (e.source === parent) {
        if (e.data?.channel === 'hyperrizz-bootstrap' && typeof e.data.html === 'string' && e.data.html.length < 50331648) {
          film.srcdoc = e.data.html;
        } else if (e.data?.channel === 'hyperrizz-review') {
          film.contentWindow.postMessage(e.data, '*');
        }
      } else if (e.source === film.contentWindow && e.data?.channel === 'hyperrizz-review') {
        parent.postMessage(e.data, '*');
      }
    });
    parent.postMessage({channel:'hyperrizz-bootstrap',type:'ready'}, '*');
  </script>
</body>
</html>
