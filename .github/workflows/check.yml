name: Plugin, package and media checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate skill package
        run: python3 scripts/check-package.py
      - name: Install plugin test dependencies
        run: python3 -m pip install 'pytest>=8,<10' 'pyyaml>=6,<7' 'fastapi>=0.115,<1'
      - name: Verify plugin behavior contracts
        run: python3 -m pytest tests/test_plugin.py -q
      - name: Exercise media-verifier failure cases
        run: python3 tests/test_verifier.py
      - name: Verify broadcast timing and rig contracts
        run: node --test tests/*.test.mjs
